# Ultralytics YOLO 🚀, AGPL-3.0 license
# YOLO11 object detection model with P2-P4 outputs (no P5).
# Based on yolo11-p2-FEMCBS-Ghost2.yaml with P5 backbone/head removed.

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# Backbone (P1-P4 only, no P5)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, GhostConv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2Ghost, [512, False, 0.25]]
  - [-1, 1, GhostConv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2Ghost, [512, True]]
  - [-1, 1, SPPF, [512, 5]] # 7
  - [-1, 2, C2PSA, [512]] # 8

# Head (P2-P4 detection, no P5)
head:

  - [2, 1, FEMCBS, []] # 9  P2 bridge
  - [4, 1, FEMCBS, []] # 10 P3 bridge
  - [8, 1, FEMCBS, []] # 11 P4 bridge

  # FPN top-down: P4 -> P3
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 10], 1, Concat, [1]] # cat P3 bridge
  - [-1, 2, C3k2Ghost, [256, False]] # 14

  # FPN top-down: P3 -> P2
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 9], 1, Concat, [1]] # cat P2 bridge
  - [-1, 2, C3k2Ghost, [128, False]] # 17 (P2/4-xsmall)

  # PAN bottom-up: P2 -> P3
  - [-1, 1, GhostConv, [128, 3, 2]]
  - [[-1, 14], 1, Concat, [1]] # cat head P3
  - [-1, 2, C3k2Ghost, [256, False]] # 20 (P3/8-small)

  # PAN bottom-up: P3 -> P4
  - [-1, 1, GhostConv, [256, 3, 2]]
  - [[-1, 11], 1, Concat, [1]] # cat P4 bridge
  - [-1, 2, C3k2Ghost, [512, False]] # 23 (P4/16-medium)

  - [[17, 20, 23], 1, Detect, [nc]] # Detect(P2, P3, P4)
